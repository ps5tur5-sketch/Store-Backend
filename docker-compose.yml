services:
  postgres:
    image: postgres:17-alpine
    command: ["postgres", "-c", "track_commit_timestamp=on"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hr}
      POSTGRES_USER: ${POSTGRES_USER:-hr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hr}
    ports:
      - "${POSTGRES_BIND_IP:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hr} -d ${POSTGRES_DB:-hr}"]
      interval: 2s
      timeout: 2s
      retries: 30
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build:
      context: .
      network: host
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-hr}:${POSTGRES_PASSWORD:-hr}@postgres:5432/${POSTGRES_DB:-hr}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin_demo}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-AdminDemo2026!}
      SELLER_PASSWORD: ${SELLER_PASSWORD:-SellerDemo2026!}
      DEMO_MARKETPLACE: ${DEMO_MARKETPLACE:-true}
      HOST: 0.0.0.0
      PORT: 3000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      WORKER_ENABLED: ${WORKER_ENABLED:-true}
      WORKER_POLL_MS: ${WORKER_POLL_MS:-200}
      RECOVERY_POLL_MS: ${RECOVERY_POLL_MS:-5000}
      SUPPLIER_SHARED_SECRET: ${SUPPLIER_SHARED_SECRET:-LocalSupplierDemo2026!}
      SUPPLIER_BASE_URL: http://backend:3000
      SUPPLIER_TIMEOUT_MS: ${SUPPLIER_TIMEOUT_MS:-300}
      SUPPLIER_MAX_ATTEMPTS: ${SUPPLIER_MAX_ATTEMPTS:-3}
      SUPPLIER_BACKOFF_MS: ${SUPPLIER_BACKOFF_MS:-50}
      ENABLE_TEST_CONTROLS: ${ENABLE_TEST_CONTROLS:-true}
    ports:
      - "${BACKEND_BIND_IP:-0.0.0.0}:${BACKEND_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  postgres-test:
    image: postgres:17-alpine
    command: ["postgres", "-c", "track_commit_timestamp=on"]
    profiles: ["test"]
    environment:
      POSTGRES_DB: hr
      POSTGRES_USER: hr
      POSTGRES_PASSWORD: hr
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hr -d hr"]
      interval: 1s
      timeout: 2s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data

  tests:
    build:
      context: .
      target: build
      network: host
    profiles: ["test"]
    environment:
      DATABASE_URL: postgresql://hr:hr@postgres-test:5432/hr
    command: npm test
    depends_on:
      postgres-test:
        condition: service_healthy

volumes:
  postgres_data:
